# On the tailnet as http://<name>-app.<tailnet>.ts.net (the operator names it after the namespace
# and the Service), tagged tag:preview (the tailnet policy says who reaches it).
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: {{ .Values.name }}
  annotations:
    tailscale.com/tags: tag:preview
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector: { app: app }
  ports: [{ name: http, port: 80, targetPort: http }]
