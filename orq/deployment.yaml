# orq serve. Non-root, read-only, no Kubernetes token; only the database login from orq-db.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orq-serve
spec:
  replicas: 1
  selector: { matchLabels: { app: orq-serve } }
  template:
    metadata:
      labels: { app: orq-serve }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: orq
          image: ghcr.io/saculo/orqestrai
          args: [serve, --host, 0.0.0.0, --port, "7400"]
          ports: [{ name: http, containerPort: 7400 }]
          env:
            - { name: PGSSLROOTCERT, value: /etc/orq/ca.crt }
            - name: PGHOST
              valueFrom: { secretKeyRef: { name: orq-db, key: PGHOST } }
            - name: PGPORT
              valueFrom: { secretKeyRef: { name: orq-db, key: PGPORT } }
            - name: PGDATABASE
              valueFrom: { secretKeyRef: { name: orq-db, key: PGDATABASE } }
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: orq-db, key: PGUSER } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: orq-db, key: PGPASSWORD } }
            - name: PGSSLMODE
              valueFrom: { secretKeyRef: { name: orq-db, key: PGSSLMODE } }
          volumeMounts: [{ name: ca, mountPath: /etc/orq, readOnly: true }]
          readinessProbe:
            httpGet: { path: /slots, port: http } # answers only when the database does
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - name: ca
          secret:
            secretName: orq-db
            optional: true
            items: [{ key: ca.crt, path: ca.crt }]
