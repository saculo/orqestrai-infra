# The database login, from OpenBao secret/orq/db: PGHOST, PGPORT, PGDATABASE, PGUSER,
# PGPASSWORD, PGSSLMODE, and ca.crt (the database server's CA, for PGSSLMODE=verify-ca).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orq-db
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target: { name: orq-db }
  dataFrom:
    - extract: { key: orq/db }
