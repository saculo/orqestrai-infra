# Only External Secrets may call OpenBao. (You reach it with kubectl exec.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: only-external-secrets
  namespace: openbao
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: external-secrets } }
      ports: [{ port: 8200 }]
