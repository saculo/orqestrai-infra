# orq serve. Non-root, read-only but for its state volume, no Kubernetes token.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orq-serve
spec:
  replicas: 1
  strategy: { type: Recreate } # one orq serve at a time opens the SQLite file
  selector: { matchLabels: { app: orq-serve } }
  template:
    metadata:
      labels: { app: orq-serve }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: orq
          image: ghcr.io/saculo/orqestrai
          args: [serve, --host, 0.0.0.0, --port, "7400"]
          ports: [{ name: http, containerPort: 7400 }]
          env:
            - { name: ORQ_DATA, value: /data }
          volumeMounts: [{ name: data, mountPath: /data }]
          readinessProbe:
            httpGet: { path: /tasks, port: http } # a query: answers only when the state file opens
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: orq-data }
