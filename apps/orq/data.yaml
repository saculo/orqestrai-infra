# orq's state: one SQLite file (and its -wal and -shm files) in ORQ_DATA. k3s's local-path volume, on the node.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: orq-data
  annotations:
    # never deleted by Argo CD, not even with its Application: it holds orq's state
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 1Gi }
