# The store External Secrets reads (OpenBao), the Tailscale operator's login from it, and
# who may reach OpenBao. After openbao and external-secrets.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/saculo/orqestrai-infra
    targetRevision: {{ .Values.revision }}
    path: platform
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry: { limit: 10, backoff: { duration: 30s, maxDuration: 5m } } # waits for the CRDs above
