# orq serve: the one process with the database login (orq/).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: orq
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/saculo/orqestrai-infra
    targetRevision: {{ .Values.revision }}
    path: orq
  destination:
    server: https://kubernetes.default.svc
    namespace: orq
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry: { limit: 10, backoff: { duration: 30s, maxDuration: 5m } }
