# OpenBao: every credential (Postgres, Tailscale, the Image Updater's GitHub token). One pod, PebbleDB on
# a volume. It unseals itself with the static key in the Secret openbao-unseal, which
# the bootstrap creates once. No ingress from outside the cluster (platform/).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://openbao.github.io/openbao-helm
    chart: openbao
    targetRevision: 0.30.7
    helm:
      valuesObject:
        injector: { enabled: false }
        server:
          dataStorage: { size: 1Gi }
          volumes: [{ name: unseal, secret: { secretName: openbao-unseal } }]
          volumeMounts: [{ name: unseal, mountPath: /openbao/unseal, readOnly: true }]
          standalone:
            config: |
              ui = false
              disable_mlock = true
              listener "tcp" {
                tls_disable = 1
                address = "[::]:8200"
                cluster_address = "[::]:8201"
              }
              storage "pebbledb" {
                path = "/openbao/data/pebbledb"
              }
              seal "static" {
                current_key_id = "unseal-1"
                current_key = "file:///openbao/unseal/key"
              }
  destination:
    server: https://kubernetes.default.svc
    namespace: openbao
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
